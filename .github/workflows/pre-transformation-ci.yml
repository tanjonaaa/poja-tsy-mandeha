name: POJA Import CI

on:
  push:
    branches:
      - infra/ci
env:
  ORG_ID: 107abe9e-ac83-4973-9fd1-df8b5354503b
  IMPORT_ID: 8ff1323d-d39b-43f9-8edd-490bd3f8401d

jobs:
  post-transformation-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20


    steps:
      - uses: actions/checkout@v4.1.6

      - uses: actions/setup-java@v4.2.1
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Run tests and capture outcome
        id: test
        continue-on-error: true
        run: |
          set -o pipefail
          set +e
          
          if [ -f "build.gradle" ]; then
            chmod +x gradlew
            gradlew test
          elif [ -f "pom.xml" ]; then
            chmod +x mvnw
            ./mvnw test
          else
            echo "No build tool detected!" >&2
            echo "outcome=FAILURE" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          EXIT_CODE=$?
          set -e
          
          if [ $EXIT_CODE -eq 0 ]; then
            echo "outcome=SUCCESS" >> $GITHUB_OUTPUT
          else
            echo "outcome=FAILURE" >> $GITHUB_OUTPUT
          fi

      - run: echo ${{ steps.test.outputs.outcome }}