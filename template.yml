AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: poja-tsy-mandeha - Computation and API

Globals:
  Function:
    CodeUri: .
    Runtime: java21
    Tracing: Active
    Architectures:
      - arm64
    EventInvokeConfig:
      MaximumRetryAttempts: 0
    
    
    Environment:
      Variables:
        ENV: !Ref Env
        AWS_S3_BUCKET: !Sub '{{resolve:ssm:/poja-tsy-mandeha/${Env}/s3/bucket-name}}'
        AWS_SES_SOURCE: noreply@nowhere.com
        AWS_EVENTBRIDGE_BUS: !Sub '{{resolve:ssm:/poja-tsy-mandeha/${Env}/eventbridge/bus-name}}'
        AWS_EVENT_STACK_1_SQS_QUEUE_URL: !Sub '{{resolve:ssm:/poja-tsy-mandeha/${Env}/1/sqs/mailbox-queue-url}}'
        AWS_EVENT_STACK_2_SQS_QUEUE_URL: !Sub '{{resolve:ssm:/poja-tsy-mandeha/${Env}/2/sqs/mailbox-queue-url}}'
        
        
        JAVA_TOOL_OPTIONS: -XX:+TieredCompilation -XX:TieredStopAtLevel=1 -Dspring.main.lazy-initialization=true -Dspring.data.jpa.repositories.bootstrap-mode=lazy -Dspring.datasource.max-active=5 -Dspring.datasource.max-idle=1 -Dspring.datasource.min-idle=1 -Dspring.datasource.initial-size=1

Parameters:
  Env:
    Type: String


Resources:
  FrontalServerlessHttpApi:
    StageName: $default
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - "*"
        AllowOrigins:
          - "*"
  
  HttpApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref FrontalServerlessHttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "${FrontalFunction.Arn}:live"
      PayloadFormatVersion: "1.0"
      IntegrationMethod: ANY
      TimeoutInMillis: 120000

  DefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref FrontalServerlessHttpApi
      RouteKey: $default
      Target: !Sub "integrations/${HttpApiIntegration}"

  FrontalFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: com.company.base.handler.ApiEventHandler::handleRequest
      MemorySize: 2048
      Timeout: 30
      Role: !Sub '{{resolve:ssm:/poja-tsy-mandeha/${Env}/execution/role-arn}}'
      Events:
        ApiCall:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY
            ApiId:
              Ref: FrontalServerlessHttpApi

  WorkerFunction1:
    Type: AWS::Serverless::Function
    Properties:
      Handler: com.company.base.handler.MailboxEventHandler::handleRequest
      MemorySize: 1024
      Timeout: 600 #note(sqs-visibility)
      Role: !Sub '{{resolve:ssm:/poja-tsy-mandeha/${Env}/execution/role-arn}}'
      Events:
        AllEvents:
          Type: SQS
          Properties:
            Queue: !Sub '{{resolve:ssm:/poja-tsy-mandeha/${Env}/1/sqs/mailbox-queue-arn}}'
            BatchSize: 5

  WorkerFunction2:
    Type: AWS::Serverless::Function
    Properties:
      Handler: com.company.base.handler.MailboxEventHandler::handleRequest
      MemorySize: 1024
      Timeout: 600 #note(sqs-visibility)
      Role: !Sub '{{resolve:ssm:/poja-tsy-mandeha/${Env}/execution/role-arn}}'
      Events:
        AllEvents:
          Type: SQS
          Properties:
            Queue: !Sub '{{resolve:ssm:/poja-tsy-mandeha/${Env}/2/sqs/mailbox-queue-arn}}'
            BatchSize: 5

  ApiUrlSSM:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Join [ '', [ /poja-tsy-mandeha/, !Ref Env, /api/url ] ]
      Type: String
      Value: !GetAtt FrontalServerlessHttpApi.ApiEndpoint
  
  
Outputs:
  ApiUrl:
    Description: Url to access the frontal function
    Value: !GetAtt FrontalServerlessHttpApi.ApiEndpoint
                        